<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ショート切り出し</title>
<style>
  :root{ --bg:#101214; --card:#1a1d21; --line:#2c3138; --tx:#eceff3; --sub:#9aa3ad; --accent:#ff3d57; --ok:#3ecf8e; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;font-size:14px;line-height:1.6}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  header h1{font-size:18px;margin:0}
  header span{color:var(--sub);font-size:12px}
  .wrap{max-width:1180px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px}
  @media(max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
  .card h2{font-size:13px;margin:0;color:var(--sub);letter-spacing:.05em}
  .drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--sub);cursor:pointer}
  .drop.over{border-color:var(--accent)}
  video{width:100%;border-radius:8px;background:#000;display:block}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row label{color:var(--sub);font-size:12px;min-width:64px}
  input[type=text],input[type=number],select,textarea{background:#0e1013;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
  textarea{width:100%;resize:vertical;min-height:44px}
  input[type=range]{flex:1;min-width:120px}
  .time{width:92px;font-variant-numeric:tabular-nums}
  button{background:#23282e;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  button:disabled{opacity:.45;cursor:not-allowed}
  .stage{display:flex;justify-content:center}
  #out{width:100%;max-width:340px;aspect-ratio:9/16;height:auto;border-radius:12px;background:#000;border:1px solid var(--line)}
  .hint{color:var(--sub);font-size:12px}
  .bar{height:8px;background:#0e1013;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent)}
  .warn{color:#ffb547}
  .ok{color:var(--ok)}
  a.dl{color:var(--ok);font-weight:700}
</style>
</head>
<body>
<header>
  <h1>ショート切り出し</h1>
  <span>長い動画から縦型（9:16・1080×1920）のショートを作ります。処理はすべてこのPCの中だけで行います。</span>
</header>

<div class="wrap">
  <div class="card">
    <h2>① 元の動画</h2>
    <div class="drop" id="drop">動画ファイル（mp4 など）をドロップ／クリックで選択</div>
    <video id="src" controls playsinline hidden></video>
    <div class="row">
      <label>開始</label><input id="tStart" class="time" type="text" value="0:00">
      <button id="setStart">今の位置を開始に</button>
      <label>終了</label><input id="tEnd" class="time" type="text" value="0:30">
      <button id="setEnd">今の位置を終了に</button>
    </div>
    <div class="hint" id="lenMsg">長さ：30秒</div>
    <div class="row"><button id="previewClip">▶ 区間をプレビュー</button></div>
  </div>

  <div class="card">
    <h2>② 縦型の見た目</h2>
    <div class="stage"><canvas id="out" width="1080" height="1920"></canvas></div>
    <div class="row">
      <label>レイアウト</label>
      <select id="mode">
        <option value="blur">全体を表示（上下はぼかし背景）</option>
        <option value="crop">画面いっぱいに切り抜き</option>
      </select>
    </div>
    <div class="row"><label>左右の位置</label><input id="pos" type="range" min="0" max="100" value="50"></div>
    <div class="row"><label>拡大</label><input id="zoom" type="range" min="100" max="250" value="100"></div>
    <div class="row"><label>上の文字</label></div>
    <textarea id="title" placeholder="例：心電図のここを見る！"></textarea>
    <div class="row"><label>下の文字</label></div>
    <textarea id="sub" placeholder="例：続きは本編で"></textarea>
    <div class="row">
      <label>文字の大きさ</label><input id="fs" type="range" min="50" max="140" value="88">
      <label style="min-width:auto">色</label><input id="fc" type="color" value="#ffffff">
    </div>
  </div>

  <div class="card" style="grid-column:1/-1">
    <h2>③ 書き出し</h2>
    <div class="row">
      <button class="primary" id="exportBtn" disabled>⏺ ショートを書き出す</button>
      <button id="stopBtn" disabled>■ 中止</button>
      <span class="hint" id="fmtMsg"></span>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div id="exportMsg" class="hint">動画を読み込むと書き出せます。書き出しは区間の長さと同じだけ時間がかかります（30秒の区間なら約30秒）。その間はこのタブを前面に出したままにしてください。</div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const src=$('src'), out=$('out'), cx=out.getContext('2d');
const W=1080,H=1920;

// ---- 時間の入出力（m:ss / h:mm:ss / 秒）----
function parseT(s){s=String(s).trim();if(!s)return 0;const p=s.split(':').map(Number);if(p.some(isNaN))return NaN;return p.reduce((a,v)=>a*60+v,0);}
function fmtT(t){t=Math.max(0,t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=(t%60);const ss=s.toFixed(1).replace(/\.0$/,'').padStart(2,'0');return (h?h+':'+String(m).padStart(2,'0'):m)+':'+(s<10?'0':'')+s.toFixed(1).replace(/\.0$/,'');}
function range(){const a=parseT($('tStart').value),b=parseT($('tEnd').value);return {a,b,ok:!isNaN(a)&&!isNaN(b)&&b>a};}
function updateLen(){const r=range();const el=$('lenMsg');
  if(!r.ok){el.innerHTML='<span class="warn">開始・終了の時間を確認してください（例 1:23 や 0:05.5）</span>';return;}
  const L=r.b-r.a;el.innerHTML=`長さ：${L.toFixed(1)}秒`+(L>180?' <span class="warn">— ショートは最大3分（180秒）です</span>':(L>60?' <span class="hint">（60秒を超えるショートも投稿できます）</span>':''));}
['tStart','tEnd'].forEach(id=>$(id).addEventListener('input',updateLen));
$('setStart').onclick=()=>{$('tStart').value=fmtT(src.currentTime);updateLen();};
$('setEnd').onclick=()=>{$('tEnd').value=fmtT(src.currentTime);updateLen();};

// ---- 読み込み ----
let fileName='short';
function load(f){if(!f)return;fileName=f.name.replace(/\.[^.]+$/,'');src.src=URL.createObjectURL(f);src.hidden=false;}
const drop=$('drop');
drop.onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='video/*';i.onchange=e=>load(e.target.files[0]);i.click();};
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');load(e.dataTransfer.files[0]);});
src.addEventListener('loadedmetadata',()=>{
  $('tEnd').value=fmtT(Math.min(src.duration,30));updateLen();$('exportBtn').disabled=false;
  $('exportMsg').textContent=`読み込みました（${src.videoWidth}×${src.videoHeight}、${fmtT(src.duration)}）。区間と見た目を決めて書き出してください。`;
  draw();
});
src.addEventListener('error',()=>{$('exportMsg').innerHTML='<span class="warn">この動画はブラウザで再生できませんでした。ChromeかEdgeで開くか、mp4（H.264）に変換してください。</span>';});

// ---- 描画 ----
function wrapLines(text,maxW){const lines=[];for(const para of text.split('\n')){let cur='';for(const ch of para){if(cx.measureText(cur+ch).width>maxW&&cur){lines.push(cur);cur=ch;}else cur+=ch;}lines.push(cur);}return lines.filter((l,i,a)=>l||a.length===1);}
function drawText(text,yTop,anchorBottom){
  text=text.trim();if(!text)return;
  const fs=+$('fs').value;cx.font=`900 ${fs}px "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif`;
  const lines=wrapLines(text,W-120),lh=fs*1.25;let y=anchorBottom?yTop-lh*(lines.length-1):yTop;
  cx.textAlign='center';cx.textBaseline='middle';cx.lineJoin='round';
  for(const l of lines){cx.lineWidth=fs*0.18;cx.strokeStyle='rgba(0,0,0,.92)';cx.strokeText(l,W/2,y);cx.fillStyle=$('fc').value;cx.fillText(l,W/2,y);y+=lh;}
}
function draw(){
  cx.fillStyle='#000';cx.fillRect(0,0,W,H);
  const vw=src.videoWidth,vh=src.videoHeight;
  if(vw&&vh){
    const pos=$('pos').value/100,zoom=$('zoom').value/100;
    if($('mode').value==='crop'){
      const s=Math.max(H/vh,W/vw)*zoom,dw=vw*s,dh=vh*s;
      cx.drawImage(src,(W-dw)*pos,(H-dh)/2,dw,dh);
    }else{
      const sb=Math.max(H/vh,W/vw),bw=vw*sb,bh=vh*sb;
      cx.save();cx.filter='blur(40px) brightness(.55)';cx.drawImage(src,(W-bw)/2-60,(H-bh)/2-60,bw+120,bh+120);cx.restore();
      const s=(W/vw)*zoom,dw=vw*s,dh=vh*s;
      cx.drawImage(src,(W-dw)*pos,(H-dh)/2,dw,dh);
    }
  }
  drawText($('title').value,300,false);
  drawText($('sub').value,H-300,true);
}
['mode','pos','zoom','title','sub','fs','fc'].forEach(id=>$(id).addEventListener('input',draw));
src.addEventListener('seeked',draw);
let previewing=false;
function loop(){draw();if(!src.paused&&!src.ended)requestAnimationFrame(loop);}
src.addEventListener('play',()=>requestAnimationFrame(loop));
src.addEventListener('timeupdate',()=>{if(previewing){const r=range();if(r.ok&&src.currentTime>=r.b){src.pause();previewing=false;}}});
$('previewClip').onclick=()=>{const r=range();if(!r.ok||!src.src)return;src.currentTime=r.a;previewing=true;src.play();};
draw();

// ---- 書き出し（Canvas + 元動画の音声 → MediaRecorder）----
function pickType(){
  const c=['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4;codecs=avc1,mp4a','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  return c.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
}
let audioCtx=null,audioDest=null,rec=null,stopReq=false;
function ensureAudio(){
  if(audioCtx)return;
  audioCtx=new AudioContext();const node=audioCtx.createMediaElementSource(src);
  audioDest=audioCtx.createMediaStreamDestination();node.connect(audioDest);node.connect(audioCtx.destination);
}
$('stopBtn').onclick=()=>{stopReq=true;};
$('exportBtn').onclick=async()=>{
  const r=range();if(!r.ok){updateLen();return;}
  const type=pickType();if(!type){$('exportMsg').innerHTML='<span class="warn">このブラウザは動画の書き出しに対応していません。ChromeかEdgeで開いてください。</span>';return;}
  const ext=type.startsWith('video/mp4')?'mp4':'webm';
  $('fmtMsg').textContent=`形式：${ext.toUpperCase()}`;
  ensureAudio();await audioCtx.resume();
  const stream=out.captureStream(30);
  for(const t of audioDest.stream.getAudioTracks())stream.addTrack(t);
  const chunks=[];rec=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:10_000_000,audioBitsPerSecond:192_000});
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  const done=new Promise(res=>rec.onstop=res);
  stopReq=false;previewing=false;$('exportBtn').disabled=true;$('stopBtn').disabled=false;
  src.pause();src.currentTime=r.a;await new Promise(res=>src.addEventListener('seeked',res,{once:true}));
  draw();rec.start(1000);await src.play();
  $('exportMsg').textContent='書き出し中…（このタブを前面のままにしてください）';
  await new Promise(res=>{
    const tick=()=>{draw();const p=Math.min(1,(src.currentTime-r.a)/(r.b-r.a));$('prog').style.width=(p*100).toFixed(1)+'%';
      if(stopReq||src.ended||src.currentTime>=r.b){res();return;}
      if(src.requestVideoFrameCallback)src.requestVideoFrameCallback(tick);else requestAnimationFrame(tick);};
    tick();
  });
  src.pause();rec.stop();await done;
  $('exportBtn').disabled=false;$('stopBtn').disabled=true;
  if(stopReq){$('exportMsg').textContent='中止しました。';$('prog').style.width='0';return;}
  const blob=new Blob(chunks,{type:type.split(';')[0]});
  const url=URL.createObjectURL(blob),name=`${fileName}_short_${fmtT(r.a).replace(/[:.]/g,'-')}.${ext}`;
  const a=document.createElement('a');a.href=url;a.download=name;a.click();
  $('exportMsg').innerHTML=`<span class="ok">✅ 書き出しました（${(blob.size/1048576).toFixed(1)}MB）。</span> 保存されない場合は <a class="dl" href="${url}" download="${name}">ここをクリック</a>。YouTubeアプリやYouTube Studioから、そのままショートとしてアップロードできます。`;
};
</script>
</body>
</html>
