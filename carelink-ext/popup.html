<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body{width:360px;font:13px -apple-system,"Hiragino Kaku Gothic ProN",sans-serif;margin:0;background:#0b1120;color:#e6eefb}
  .wrap{padding:12px}
  h1{font-size:14px;margin:0 0 8px}
  textarea{width:100%;height:90px;box-sizing:border-box;background:#0a1320;color:#e6eefb;border:1px solid #22314a;border-radius:8px;padding:8px;resize:vertical;font-family:ui-monospace,monospace}
  .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  button{background:#16233a;color:#e6eefb;border:1px solid #22314a;border-radius:8px;padding:7px 12px;cursor:pointer}
  button.primary{background:#38bdf8;color:#04222e;font-weight:700;border-color:#38bdf8}
  button:hover{border-color:#38bdf8}
  .hint{color:#9aa8bf;font-size:11px;margin-top:8px;line-height:1.5}
  #status{font-size:12px;color:#fbbf24;margin-top:8px;min-height:16px}
  table{width:100%;border-collapse:collapse;margin-top:8px;font-size:11.5px}
  th,td{border:1px solid #22314a;padding:4px 5px;text-align:left}
  th{background:#0a1320;color:#bfe3fb}
  .warn{color:#fbbf24;font-size:11px;border:1px solid #3a2e12;background:rgba(251,191,36,.08);border-radius:8px;padding:6px 8px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>CareLink 遠隔データ抽出 <span style="color:#9aa8bf;font-weight:400">β</span></h1>
  <div class="warn">⚠️ 自施設・Medtronicの規約で自動化が許可されている前提で使用してください。完全ローカル処理（PHIは端末外に出しません）。最終判断は医師。</div>
  <label style="display:block;margin-top:8px;color:#9aa8bf;font-size:11px">患者ID（1行に1件・複数可）</label>
  <textarea id="ids" placeholder="01652389&#10;01652390&#10;..."></textarea>
  <div class="row">
    <button class="primary" id="run">▶ 抽出する</button>
    <button id="scrape">現在の画面から取り込む</button>
    <button id="csv">CSV出力</button>
  </div>
  <div id="status"></div>
  <div id="result"></div>
  <div class="hint">
    使い方：CareLinkにログイン → IDを貼る → 「抽出する」。<br>
    ※ CareLinkの画面構造（検索・レポートの出し方）が分かり次第、自動巡回を有効化します。現状は「現在の画面から取り込む」で、開いているレポートの数値を拾えます。
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
