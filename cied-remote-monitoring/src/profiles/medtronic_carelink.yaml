# Medtronic CareLink（Azure XT DR 等）抽出プロファイル — v1（行ベース方式）
#
# 実レポート1件（イベントなしの基本パターン、Quick Look II / 電池およびリード測定 /
# レートヒストグラム の3ページ）の実際のテキストと、実際のカルテ転記例（いずれも
# 氏名・ID・シリアル番号等は置換済み）をもとに作成。value_pattern は実際の行に対して
# 動作確認済み（tests/test_extract_engine.py）。
#
# 設計方針（2026/08/21、実データ検証を経て決定）:
# 当初はラベルの位置（bbox）を起点に値を探す方式（docs/03-extraction-design.md 3.5）を
# 想定していたが、実レポートは「項目名 値1 値2 ...」の形で1行に収まることが多いとわかった。
# そこで value_pattern はラベル文字列を含めて自己完結させ、1行に対してそのまま
# 正規表現マッチさせる方式にした。同じ行に複数項目が並ぶ場合（例:
# 「モードスイッチ 171 bpm 上限トラッキング130 bpm センスAV 150 ms」）に、
# 隣の項目の値を誤って拾わないための設計。
#
# 参照: docs/03-extraction-design.md 3.5・3.9、docs/04-data-model.md 4.3/4.4

manufacturer: Medtronic

identify:
  any_of:
    - "CareLink"
    - "Medtronic"
    - "メドトロニック"
  min_score: 1

fields:
  # --- デバイス情報 ---
  # 「デバイス： Azure™ XT DR MRI W2DR01 シリアル番号：BBB」
  # 型番の書式（英字1+数字1+英字2+数字2）は今回の1例からの推測。他機種で当てはまらなければ見直す。
  device.model_name:
    value_pattern: 'デバイス[：:]\s*(.+?)\s+[A-Z]\d[A-Z]{2}\d{2}\s+シリアル番号'
    type: str

  device.model_number:
    value_pattern: 'デバイス[：:].+?\s+([A-Z]\d[A-Z]{2}\d{2})\s+シリアル番号'
    type: str

  device.serial_number:
    value_pattern: 'シリアル番号[：:]\s*([A-Za-z0-9]+)'
    type: str

  # 「デバイスステータス (植込み日：01-Apr-2025)」
  device.implant_date:
    value_pattern: '植込み日[：:]\s*(\d{2}-[A-Za-z]{3}-\d{4})'
    type: date

  # 「モード AAI<=>DDD 基本レート 60 bpm ペースAV 180 ms」
  device.programmed_mode:
    value_pattern: 'モード\s+([A-Z<>=]+)\s+基本レート'
    type: str

  device.lower_rate:
    value_pattern: '基本レート\s+(\d+)\s*bpm'
    type: int

  # 「モードスイッチ 171 bpm 上限トラッキング130 bpm センスAV 150 ms」
  # コピー&ペーストで項目名と数字の間の空白が消えることがある（"トラッキング130"）。空白なしでも通す。
  device.upper_rate:
    value_pattern: '上限トラッキング\s*(\d+)\s*bpm'
    type: int

  # --- 電池 ---
  # 「電池およびリード測定」ページの「推定値：10.7 years」「最大値：11.2 years」より。
  # カルテの「ERI：13.1-13.7（y）」はこの2値をアプリ側で組み立てた表示（ユーザー確認済み）。
  # 帳票に「ERI」という単語自体は印字されていない。
  battery.remaining_months:
    value_pattern: '推定値[：:]\s*(\d+(?:\.\d+)?)\s*years?'
    unit_map: {years: months_x12, year: months_x12}
    type: float
    range: [0, 240]

  battery.remaining_months_min:
    value_pattern: '最小値[：:]\s*(\d+(?:\.\d+)?)\s*years?'
    unit_map: {years: months_x12, year: months_x12}
    type: float
    range: [0, 240]

  battery.remaining_months_max:
    value_pattern: '最大値[：:]\s*(\d+(?:\.\d+)?)\s*years?'
    unit_map: {years: months_x12, year: months_x12}
    type: float
    range: [0, 240]

  # 「電圧 3.01 V」（セクション見出しの「電池電圧 20-Aug-2026」には数値+Vが無いので誤マッチしない）
  battery.voltage:
    value_pattern: '電圧\s+(\d+\.\d+)\s*V'
    type: float
    range: [1.5, 4.0]

  # 「(RRT=2.63V)」。今回のカルテ例では転記されていないが、電池関連情報として抽出はしておく。
  battery.rrt_voltage:
    value_pattern: 'RRT=(\d+\.\d+)V'
    type: float
    range: [1.5, 4.0]

  # --- リード ---
  # 「電池およびリード測定」ページの「Aペーシング (バイポーラ) 380 Ω」
  # 「RVペーシング (バイポーラ) 532 Ω」より（ラベルにRA/RVが直接含まれ、1行1項目で明確）。
  leads.RA.impedance:
    value_pattern: 'Aペーシング[^\d]*(\d+)\s*Ω'
    type: int
    range: [200, 2000]

  leads.RV.impedance:
    value_pattern: 'RVペーシング[^\d]*(\d+)\s*Ω'
    type: int
    range: [200, 2000]

  # 「ペーシング閾値 1.500 V (0.40 ms) 1.000 V (0.40 ms)」（Quick Look IIページ、RA→RVの順で1行に並ぶ）
  leads.threshold_pair:
    value_pattern: 'ペーシング閾値\s+(\d+\.\d+)\s*V\s*\((\d+\.\d+)\s*ms\)\s+(\d+\.\d+)\s*V\s*\((\d+\.\d+)\s*ms\)'
    parts:
      - leads.RA.threshold_voltage
      - leads.RA.threshold_pulse_width
      - leads.RV.threshold_voltage
      - leads.RV.threshold_pulse_width
    type: float

  # 「電池およびリード測定」ページの「P波高値 2.5 mV」「R波高値 18.0 mV」より（1行1項目）。
  # 未測定は数値の代わりに「-」等が入り \d+\.\d+ にマッチしないため、自然にnullになる。
  # 「R波高値」は他ページの「P/R波高値」の部分文字列として誤マッチするため、
  # 直前が「/」でないことを要求する（negative lookbehind）。
  leads.RA.sensing_amplitude:
    value_pattern: 'P波高値\s+(\d+\.\d+)\s*mV'
    type: float
    range: [0, 30]

  leads.RV.sensing_amplitude:
    value_pattern: '(?<!/)R波高値\s+(\d+\.\d+)\s*mV'
    type: float
    range: [0, 30]

  # --- ペーシング率（レートヒストグラムページ） ---
  # 各行に「前回チェックまで」「前回チェック以降」の2値が並ぶ。カルテには「前回チェック以降」
  # （＝今回時点で新しい方の期間）の値を書いていたため、2つ目の数値を採用する。
  # 例:「時間% AS-VS 47.1% 38.1%」→ 38.1% を採用。
  # カルテ転記例で確認済み（優先度：高）。
  pacing.as_vs_percent:
    value_pattern: 'AS-VS\s+(?:<?\s*\d+(?:\.\d+)?)\s*%\s+(<?\s*\d+(?:\.\d+)?)\s*%'
    type: float
    range: [0, 100]

  pacing.as_vp_percent:
    value_pattern: 'AS-VP\s+(?:<?\s*\d+(?:\.\d+)?)\s*%\s+(<?\s*\d+(?:\.\d+)?)\s*%'
    type: float
    range: [0, 100]

  pacing.ap_vs_percent:
    value_pattern: 'AP-VS\s+(?:<?\s*\d+(?:\.\d+)?)\s*%\s+(<?\s*\d+(?:\.\d+)?)\s*%'
    type: float
    range: [0, 100]

  pacing.ap_vp_percent:
    value_pattern: 'AP-VP\s+(?:<?\s*\d+(?:\.\d+)?)\s*%\s+(<?\s*\d+(?:\.\d+)?)\s*%'
    type: float
    range: [0, 100]

  # 総VP/総APはカルテ転記例には出てこなかったが、参考として抽出しておく（優先度：中）。
  pacing.ventricular_pacing_percent:
    value_pattern: '総VP\s+(?:<?\s*\d+(?:\.\d+)?)\s*%\s+(<?\s*\d+(?:\.\d+)?)\s*%'
    type: float
    range: [0, 100]

  pacing.atrial_pacing_percent:
    value_pattern: '総AP\s+(?:<?\s*\d+(?:\.\d+)?)\s*%\s+(<?\s*\d+(?:\.\d+)?)\s*%'
    type: float
    range: [0, 100]

  # --- 不整脈 ---
  # 「イベントなし」のカルテ例には出てこなかった項目。イベントありの実例で優先度を確定させる（★仮）。
  arrhythmia.vt_episode_count:
    value_pattern: 'VT \(>4 beat\)\s+(\d+)'
    type: int
    range: [0, 9999]

  # --- メーカー固有（extras、今回は未対応） ---
  # - センシング・インテグリティ・カウンタ（短いV-Vインターバル）
  # - 心房リードポジションチェック
  # - AT/AF時間（ページによって "hr/day (%)" と "= n sec" で書式が異なり、今回は未対応）
  # - Cardiac Compassトレンド（グラフなので値の抽出は別途検討）
  # - オブザベーション（自由記述コメント）
