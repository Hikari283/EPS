[project]
name = "cied-remote-monitoring"
version = "0.1.0"
description = "CIED遠隔モニタリング デバイス一元管理システム（院内向け・オフライン）"
requires-python = ">=3.12"
dependencies = [
    "pypdfium2",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
